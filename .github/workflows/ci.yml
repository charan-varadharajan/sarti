name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/version.py check
      - if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/version.py check --tag "${GITHUB_REF_NAME}"

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sarti_test
          POSTGRES_USER: sarti_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sarti_test -d sarti_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SARTI_ENVIRONMENT: test
      SARTI_DATABASE_URL: postgresql+psycopg://sarti_test@localhost:5432/sarti_test
      SARTI_RUN_MOBILE_CONTRACT: '1'
      SARTI_RUN_GUARDIAN_CONTRACT: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r backend/requirements.lock
      - run: ruff format --check src tests alembic scripts_generate_openapi.py
        working-directory: backend
      - run: ruff check src tests alembic scripts_generate_openapi.py
        working-directory: backend
      - run: mypy
        working-directory: backend
      - run: bandit -q -r src
        working-directory: backend
      - run: pip-audit -r requirements-runtime.lock
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: pytest --cov --cov-report=term-missing
        working-directory: backend
      - run: python scripts_generate_openapi.py
        working-directory: backend
      - run: git diff --exit-code -- backend/openapi.json

  mobile-android:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test --coverage
        working-directory: mobile
      - run: flutter build apk --debug
        working-directory: mobile
      - name: Prepare isolated Android API 35 emulator
        run: |
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-35;google_apis;x86_64"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name sarti_ci --package "system-images;android-35;google_apis;x86_64" --device pixel_7
          mkdir -p test-results
          nohup "$ANDROID_HOME/emulator/emulator" -avd sarti_ci -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -accel on > test-results/android-ci-emulator.log 2>&1 &
          timeout 180 adb -s emulator-5554 wait-for-device
          timeout 180 adb -s emulator-5554 shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done'
          adb -s emulator-5554 shell input keyevent 82
      - name: Run all prepared native Android scenarios
        run: ./test --android --device emulator-5554
      - name: Capture failed Android fixture screen
        if: failure()
        run: |
          mkdir -p test-results
          adb -s emulator-5554 exec-out screencap -p > test-results/android-ci-failure.png || true
      - name: Publish native Android results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-results
          path: |
            test-results/android-*.log
            test-results/android-ci-failure.png
          if-no-files-found: warn
          retention-days: 7
      - name: Stop isolated CI emulator
        if: always()
        run: adb -s emulator-5554 emu kill || true

  mobile-ios:
    timeout-minutes: 60
    # passkeys diagnostics use an iOS 26.1 SDK API while retaining iOS 13 runtime support.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - run: flutter build ios --debug --no-codesign
        working-directory: mobile
      - name: Run prepared native iOS scenarios
        run: python3 scripts/ci_ios_tests.py
      - name: Publish native iOS test results and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-results
          path: test-results/ios-ci/
          if-no-files-found: error
          retention-days: 7

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cp .env.example .env
      - run: docker compose up --build --wait
      - run: curl --fail --silent http://localhost:8000/v1/health/live
      - run: curl --fail --silent http://localhost:8000/v1/health/ready
      - if: always()
        run: docker compose down --volumes

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan Git history and working tree for secrets
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source /repo --redact --no-banner

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
