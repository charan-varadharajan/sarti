name: sarti_mobile
description: Privacy-first family organization for iOS and Android.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  crypto: 3.0.7
  firebase_core: 4.15.0
  firebase_messaging: 16.7.0
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_local_notifications: 22.3.1
  flutter_secure_storage: 11.2.0
  google_generative_ai: 0.4.7
  local_auth: 3.0.2
  passkeys: 2.23.1
  path_provider: 2.1.6
  sodium: 4.1.1+2
  sqlite3: 3.7.0
  timezone: 0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
